# ~/1337.yml - everything `1337` does in a session.
#
# `1337 setup` writes it from this example and your answers; `1337 repo add`
# adds repos. Edit it by hand for anything else. Any value can use $HOME,
# $USER and the names under `variables`.
#
# relocated, tools, synced and repos hold items. Item keywords:
#   source   where it comes from: a download URL (tools) or a git URL
#   dest     where it lives on goinfre
#   link     a $HOME path replaced by a symlink to dest
#   setup    lines run once, right after dest is created ($SOURCE, $DEST set)
#   path     folders added to PATH
#   env      variables exported to the shell
#   needs    other items to set up first
#   squash   synced and repos: keep a single commit, force-pushed
#   gitignore  synced and repos: the .gitignore of a new, empty repo
#
# login and logout hold steps, run in order. Step keywords:
#   run            lines run as one bash script
#   do             a built-in: link, install, sync, clone, push or unlink
#   choose         true: ask which items (or options) to use, with checkboxes
#   options        lines printing the choices of a `run` step ($CHOSEN, $SKIPPED)
#   message        the commit message of `do: push`
#   ignore_errors  true: keep going when this step fails

variables:
    GITHUB_USER: <you>                    # your GitHub username
    GITHUB_EMAIL: <your email>            # for your commits
    GOINFRE: /goinfre/$USER
    TOOLS: $GOINFRE/tools
    RELOCATED: $GOINFRE/relocated
    SYNCED: $GOINFRE/synced
    WORKSPACE: $GOINFRE/workspace
    NODE_VERSION: 24.21.0
    FLUTTER_VERSION: 3.47.5
    BEEKEEPER_VERSION: 6.1.4
    ANDROID_TOOLS_VERSION: 15859902
    ANDROID_API: 36

relocated:                                # $HOME folders moved to goinfre, emptied at logout
    cache:                                # most apps' caches
        link: $HOME/.cache
        dest: $RELOCATED/.cache
    npm:                                  # npm's download cache
        link: $HOME/.npm
        dest: $RELOCATED/.npm
    vscode:                               # VS Code extensions
        link: $HOME/.vscode
        dest: $RELOCATED/.vscode
    vscode-shared:                        # VS Code shared state
        link: $HOME/.vscode-shared
        dest: $RELOCATED/.vscode-shared
    copilot:                              # GitHub Copilot
        link: $HOME/.copilot
        dest: $RELOCATED/.copilot
    dotnet:                               # .NET SDKs and tools
        link: $HOME/.dotnet
        dest: $RELOCATED/.dotnet
    code-data:                            # VS Code caches and workspace state
        link: $HOME/.config/Code
        dest: $RELOCATED/.config/Code
    uv-data:                              # pythons and tools installed by uv
        link: $HOME/.local/share/uv
        dest: $RELOCATED/.local/share/uv
    gitkraken:                            # GitKraken CLI
        link: $HOME/.local/share/GitKrakenCLI
        dest: $RELOCATED/.local/share/GitKrakenCLI
    docker-data:                          # where docker writes when it ignores daemon.json
        link: $HOME/.local/share/docker
        dest: $RELOCATED/.local/share/docker

tools:
    code:                                 # VS Code
        source: https://update.code.visualstudio.com/latest/linux-x64/stable
        dest: $TOOLS/code
        path:
            - $TOOLS/code/bin
        setup:
            - curl -fL -o code.tar.gz "$SOURCE"
            - tar -xzf code.tar.gz
            - mv VSCode-linux-x64 "$DEST"
    node:                                 # Node.js and npm
        source: https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-linux-x64.tar.xz
        dest: $TOOLS/node
        path:
            - $TOOLS/node/bin
        setup:
            - curl -fL -o node.tar.xz "$SOURCE"
            - tar -xJf node.tar.xz
            - mv node-v$NODE_VERSION-linux-x64 "$DEST"
    uv:                                   # Python, its versions and packages
        source: https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-unknown-linux-gnu.tar.gz
        dest: $TOOLS/uv
        path:
            - $TOOLS/uv
        setup:
            - curl -fL -o uv.tar.gz "$SOURCE"
            - tar -xzf uv.tar.gz
            - mv uv-x86_64-unknown-linux-gnu "$DEST"
    ninja:                                # build tool
        source: https://github.com/ninja-build/ninja/releases/latest/download/ninja-linux.zip
        dest: $TOOLS/ninja
        path:
            - $TOOLS/ninja
        setup:
            - curl -fL -o ninja.zip "$SOURCE"
            - mkdir -p "$DEST"
            - unzip -q ninja.zip -d "$DEST"
    android:                              # Android SDK
        source: https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_TOOLS_VERSION}_latest.zip
        dest: $TOOLS/android
        env:
            ANDROID_HOME: $TOOLS/android
            ANDROID_SDK_ROOT: $TOOLS/android
            ANDROID_USER_HOME: $HOME/.android        # small: adbkey, so your phone remembers this computer
            ANDROID_AVD_HOME: $TOOLS/android-home/avd  # big: emulator images stay on goinfre
            GRADLE_USER_HOME: $TOOLS/gradle
        path:
            - $TOOLS/android/cmdline-tools/latest/bin
            - $TOOLS/android/platform-tools
        setup:
            - curl -fL -o tools.zip "$SOURCE"
            - unzip -q tools.zip
            - mkdir -p "$DEST/cmdline-tools"
            - mv cmdline-tools "$DEST/cmdline-tools/latest"
            - (yes || true) | sdkmanager --licenses > /dev/null
            - sdkmanager platform-tools "platforms;android-$ANDROID_API" "build-tools;$ANDROID_API.0.0"
    emulator:                             # several GB; start it with: emulator -avd pixel_36 &
        dest: $TOOLS/android/emulator
        needs:
            - android
        path:
            - $TOOLS/android/emulator
        setup:
            - IMAGE="system-images;android-$ANDROID_API;google_apis;x86_64"
            - sdkmanager emulator "$IMAGE"
            - echo no | avdmanager create avd -n pixel_$ANDROID_API -k "$IMAGE" --device pixel
    flutter:                              # Flutter and Dart
        source: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz
        dest: $TOOLS/flutter
        needs:
            - ninja
            - android
        env:
            PUB_CACHE: $RELOCATED/.pub-cache
        path:
            - $TOOLS/flutter/bin
        setup:
            - curl -fL -o flutter.tar.xz "$SOURCE"
            - tar -xJf flutter.tar.xz
            - mv flutter "$DEST"
    beekeeper:                            # database GUI; start it with: beekeeper
        source: https://github.com/beekeeper-studio/beekeeper-studio/releases/download/v$BEEKEEPER_VERSION/Beekeeper-Studio-$BEEKEEPER_VERSION.AppImage
        dest: $TOOLS/beekeeper
        path:
            - $TOOLS/beekeeper/bin
        setup:
            - curl -fL -o app.AppImage "$SOURCE"
            - chmod +x app.AppImage
            - ./app.AppImage --appimage-extract > /dev/null
            - mv squashfs-root "$DEST"
            - mkdir "$DEST/bin"
            - echo '#!/bin/sh' > "$DEST/bin/beekeeper"
            - echo "setsid \"$DEST/AppRun\" \"\$@\" > /dev/null 2>&1 &" >> "$DEST/bin/beekeeper"
            - chmod +x "$DEST/bin/beekeeper"
    mouse:                                # keeps the session awake; start it with: mouse
        dest: $TOOLS/mouse
        path:
            - $TOOLS/mouse
        setup:
            - mkdir "$DEST"
            - echo '#!/bin/sh' > "$DEST/mouse"
            - echo 'while true; do xdotool mousemove_relative -- 1 0; sleep 300; done' >> "$DEST/mouse"
            - chmod +x "$DEST/mouse"

synced:                                   # $HOME folders kept in a private repo, pushed at logout
    google-cache:                         # Chrome profile: stay signed in everywhere
        source: git@github.com:$GITHUB_USER/google-cache.git
        dest: $SYNCED/google-cache
        link: $HOME/.config/google-chrome
        squash: true                      # History is a big binary: keep one commit
        gitignore:                        # only what keeps you signed in, not 1.8 GB of cache
            - /*
            - '!/.gitignore'
            - '!/Local State'
            - '!/First Run'
            - '!/Default/'
            - '!/Profile */'
            - /*/*
            - '!/*/Bookmarks'
            - '!/*/Bookmarks.bak'
            - '!/*/Preferences'
            - '!/*/Secure Preferences'
            - '!/*/History'
            - '!/*/Favicons'
            - '!/*/Top Sites'
            - '!/*/Shortcuts'
            - '!/*/Web Data'
            - '!/*/Login Data'
            - '!/*/Cookies'
            - '!/*/Custom Dictionary.txt'
    vscode-config:                        # VS Code settings, keybindings, extensions.txt
        source: git@github.com:$GITHUB_USER/vscode-config.git
        dest: $SYNCED/vscode-config
        link: $HOME/.config/Code/User
        gitignore:                        # what VS Code rebuilds by itself, often big
            - /workspaceStorage/
            - /globalStorage/
            - /History/
            - /sync/

repos:                                    # your code: every branch cloned at login, pushed at logout
    # add one with: 1337-repo add <name, owner/name or URL>
    my-project:
        source: git@github.com:$GITHUB_USER/my-project.git
        dest: $WORKSPACE/my-project
    team-project:                         # someone else's repo works too
        source: git@github.com:<teammate>/team-project.git
        dest: $WORKSPACE/team-project
    my-extension:                         # built after cloning, with the tools it needs
        source: git@github.com:$GITHUB_USER/my-extension.git
        dest: $WORKSPACE/my-extension
        needs:
            - code
            - node
        setup:
            - make install

login:
    identity:
        run:
            - git config --global user.name "$GITHUB_USER"
            - git config --global user.email "$GITHUB_EMAIL"
    display:
        run:
            - xrandr --output eDP --mode 2560x1440
            - gsettings set org.gnome.shell.extensions.dash-to-dock dash-max-icon-size 32
            - gsettings set org.gnome.desktop.interface text-scaling-factor 1.0
            - gsettings set org.gnome.desktop.interface scaling-factor 0
        ignore_errors: true
    relocated:                            # first, so tool setups already write into goinfre
        do: link
        choose: true
    tools:
        do: install
        choose: true
        ignore_errors: true               # a broken download must not stop your repos
    chrome:                               # the first time, the google-cache link replaces Chrome's folder
        run:
            - '[ ! -L "$HOME/.config/google-chrome" ] || exit 0'
            - pkill -x chrome || true
            - for second in $(seq 20); do pgrep -x chrome > /dev/null || exit 0; sleep 1; done
            - echo 'Chrome did not quit; close it, then try again'; exit 1
    chrome-launcher:                      # some posts' dock Chrome is the Flatpak one, with its own empty profile
        run:
            - '[ -f /var/lib/flatpak/exports/share/applications/com.google.Chrome.desktop ] || exit 0'
            - '[ -f /usr/share/applications/com.google.Chrome.desktop ] || exit 0'
            - mkdir -p "$HOME/.local/share/applications"
            - cp /usr/share/applications/com.google.Chrome.desktop "$HOME/.local/share/applications/"
    vscode:                               # the first time, the vscode-config link replaces VS Code's folder
        run:
            - '[ ! -L "$HOME/.config/Code/User" ] || exit 0'
            - pgrep -x code > /dev/null || exit 0
            - '[ "${TERM_PROGRAM:-}" != vscode ] || { echo "this terminal is part of VS Code, which has to quit: run it from another terminal"; exit 1; }'
            - pkill -x code || true
            - for second in $(seq 20); do pgrep -x code > /dev/null || exit 0; sleep 1; done
            - echo 'VS Code did not quit; close it, then try again'; exit 1
    synced:                               # a missing repo is created on GitHub, private
        do: sync
        ignore_errors: true               # a synced folder that fails must not stop your repos
    repos:
        do: clone
        choose: true
    workspace:                            # ~/Desktop/workspace: your repos on goinfre, one click away
        run:
            - '[ ! -e "$HOME/Desktop/workspace" ] || [ -L "$HOME/Desktop/workspace" ] || { echo "~/Desktop/workspace is a real folder: left alone"; exit 0; }'
            - mkdir -p "$HOME/Desktop" "$WORKSPACE"
            - ln -sfn "$WORKSPACE" "$HOME/Desktop/workspace"
    extensions:
        choose: true
        options:
            - cat "$SYNCED/vscode-config/extensions.txt" 2> /dev/null || true   # none yet in a new repo: logout writes it
        run:
            - echo "$SKIPPED" > "$GOINFRE/.skipped-extensions"
            - echo "$CHOSEN" | xargs -r -n1 code --install-extension
        ignore_errors: true               # an extension built from a repo is not on the marketplace

logout:
    chrome:                               # quit Chrome cleanly: its profile is pushed below
        run:
            - pkill -x chrome || true
            - for second in $(seq 20); do pgrep -x chrome > /dev/null || exit 0; sleep 1; done
            - echo 'Chrome did not quit; close it, then try again'; exit 1
    vscode:                               # quit VS Code: its settings are pushed below
        run:
            - pgrep -x code > /dev/null || exit 0
            - '[ "${TERM_PROGRAM:-}" != vscode ] || { echo "this terminal is part of VS Code, which has to quit: run it from another terminal"; exit 1; }'
            - pkill -x code || true
            - for second in $(seq 20); do pgrep -x code > /dev/null || exit 0; sleep 1; done
            - echo 'VS Code did not quit; close it, then try again'; exit 1
    extensions:                           # the list becomes: installed + skipped at login
        run:
            - command -v code > /dev/null || exit 0
            - '[ -d "$SYNCED/vscode-config" ] || exit 0'
            - installed=$(code --list-extensions)
            - '[ -n "$installed" ] || exit 0'
            - skipped=$(cat "$GOINFRE/.skipped-extensions" 2> /dev/null || true)
            - printf '%s\n%s\n' "$installed" "$skipped" | sed '/^$/d' | sort -fu > "$SYNCED/vscode-config/extensions.txt"
    push:                                 # synced folders and repos, every branch and tag
        do: push
        message: autosync on logout
    unlink:
        do: unlink
    workspace:                            # remove the link, never a real folder
        run:
            - '[ ! -L "$HOME/Desktop/workspace" ] || rm "$HOME/Desktop/workspace"'
    docker:
        run:
            - docker ps -q | xargs -r docker stop -t 10
            - docker system prune -a -f --volumes
        ignore_errors: true
    wipe:
        run:
            - find "$GOINFRE" -mindepth 1 -maxdepth 1 ! -name docker -exec rm -rf {} +
